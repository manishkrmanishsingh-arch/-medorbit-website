<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Explore Colleges | MedOrbit Foundation</title>

  <meta
    name="description"
    content="Explore government, private, deemed and international colleges for medical, nursing, pharmacy, engineering, management and other courses with MedOrbit Foundation."
  >

  <meta
    name="keywords"
    content="colleges in India, government colleges, private colleges, medical colleges, nursing colleges, engineering colleges, MedOrbit Foundation"
  >

  <meta name="author" content="MedOrbit Foundation">
  <meta name="theme-color" content="#0756a3">

  <link
    rel="canonical"
    href="https://medorbits.in/colleges.html"
  >

  <meta
    property="og:title"
    content="Explore Colleges | MedOrbit Foundation"
  >

  <meta
    property="og:description"
    content="Search colleges by course, ownership and location with MedOrbit Foundation."
  >

  <meta property="og:type" content="website">

  <meta
    property="og:url"
    content="https://medorbits.in/colleges.html"
  >

  <style>
    :root {
      --primary: #0756a3;
      --primary-dark: #043d77;
      --secondary: #0ea5a4;
      --accent: #ffb703;
      --success: #15803d;
      --danger: #dc2626;
      --dark: #172033;
      --text: #475569;
      --muted: #7b8796;
      --light: #f5f8fc;
      --white: #ffffff;
      --border: #dbe4ef;

      --shadow:
        0 14px 34px rgba(21, 47, 78, 0.12);

      --shadow-large:
        0 24px 60px rgba(21, 47, 78, 0.16);

      --radius: 20px;
      --radius-large: 28px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
      object-fit: cover;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    .section {
      padding: 78px 0;
    }

    .section-white {
      background: var(--white);
    }

    .section-dark {
      background: var(--dark);
      color: var(--white);
    }

    .section-heading {
      max-width: 760px;
      margin: 0 auto 42px;
      text-align: center;
    }

    .section-heading span {
      display: inline-block;
      margin-bottom: 9px;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin-bottom: 13px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
    }

    .section-heading p {
      color: var(--text);
    }

    .section-dark .section-heading span {
      color: var(--accent);
    }

    .section-dark .section-heading p {
      color: #b8c3d1;
    }

    .btn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-weight: 800;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
      box-shadow:
        0 10px 22px rgba(7, 86, 163, 0.22);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-light {
      background: var(--white);
      color: var(--primary);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--white);
    }

    .btn-outline {
      border-color: rgba(255, 255, 255, 0.65);
      color: var(--white);
      background: transparent;
    }

    .topbar {
      background: var(--primary-dark);
      color: var(--white);
      font-size: 0.9rem;
    }

    .topbar-inner {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );
      color: var(--white);
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow:
        0 10px 22px rgba(7, 86, 163, 0.22);
    }

    .logo-copy {
      display: grid;
      line-height: 1.05;
    }

    .logo-name {
      color: var(--primary);
      font-size: 1.55rem;
      font-weight: 900;
    }

    .logo-name strong {
      color: var(--dark);
    }

    .logo-copy small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.59rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      color: var(--dark);
      font-size: 0.93rem;
      font-weight: 750;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary);
    }

    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: #eaf3fc;
      color: var(--primary);
      font-size: 1.35rem;
    }

    .announcement {
      padding: 11px 0;
      background: #fff4cc;
      color: #614c00;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(4, 61, 119, 0.95),
          rgba(7, 86, 163, 0.82)
        ),
        url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1800&q=80")
        center/cover;
      color: var(--white);
    }

    .hero-grid {
      min-height: 540px;
      padding: 76px 0;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 44px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .hero h1 {
      margin-bottom: 18px;
      font-size: clamp(2.5rem, 5.6vw, 4.8rem);
      line-height: 1.03;
      letter-spacing: -0.04em;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero-copy p {
      max-width: 650px;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .hero-actions {
      display: flex;
      gap: 13px;
      flex-wrap: wrap;
      margin-top: 27px;
    }

    .search-panel {
      padding: 27px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: var(--radius-large);
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(13px);
      box-shadow: var(--shadow-large);
    }

    .search-panel h2 {
      margin-bottom: 8px;
      font-size: 1.5rem;
    }

    .search-panel p {
      margin-bottom: 18px;
      color: rgba(255, 255, 255, 0.82);
    }

    .search-form {
      display: grid;
      gap: 12px;
    }

    .search-form input,
    .search-form select {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      outline: none;
      background: var(--white);
      color: var(--dark);
    }

    .type-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .type-card {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--white);
      box-shadow: var(--shadow);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .type-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-large);
    }

    .type-card span {
      font-size: 2.1rem;
    }

    .type-card h3 {
      margin: 13px 0 7px;
      font-size: 1.15rem;
    }

    .type-card p {
      color: var(--text);
      font-size: 0.92rem;
    }

    .type-card a {
      margin-top: 16px;
      color: var(--primary);
      font-weight: 800;
    }

    .filter-bar {
      display: grid;
      grid-template-columns:
        1.3fr 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 30px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .filter-bar input,
    .filter-bar select {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: var(--white);
    }

    .college-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .college-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .college-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow-large);
    }

    .college-image {
      position: relative;
      height: 210px;
      overflow: hidden;
    }

    .college-image img {
      height: 100%;
      transition: transform 0.35s ease;
    }

    .college-card:hover .college-image img {
      transform: scale(1.05);
    }

    .college-type {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--primary);
      font-size: 0.76rem;
      font-weight: 900;
    }

    .verified {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--success);
      color: var(--white);
      font-size: 0.9rem;
      font-weight: 900;
    }

    .college-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 22px;
    }

    .college-location {
      color: var(--secondary);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .college-body h3 {
      margin: 7px 0 10px;
      font-size: 1.22rem;
      line-height: 1.3;
    }

    .college-description {
      margin-bottom: 15px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .college-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .college-tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: #eaf3fc;
      color: var(--primary);
      font-size: 0.77rem;
      font-weight: 800;
    }

    .college-actions {
      display: flex;
      gap: 9px;
      margin-top: auto;
    }

    .college-actions .btn {
      flex: 1;
      padding-inline: 11px;
    }

    .category-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .category-card {
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      transition: transform 0.25s ease;
    }

    .category-card:hover {
      transform: translateY(-5px);
    }

    .category-card span {
      font-size: 2rem;
    }

    .category-card h3 {
      margin: 13px 0 7px;
    }

    .category-card p {
      color: #b8c3d1;
      font-size: 0.9rem;
    }

    .category-card a {
      display: inline-block;
      margin-top: 14px;
      color: var(--accent);
      font-weight: 800;
    }

    .steps-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .step-card {
      padding: 24px;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .step-number {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      margin: 0 auto 13px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--white);
      font-weight: 900;
    }

    .step-card h3 {
      margin-bottom: 7px;
    }

    .step-card p {
      color: var(--text);
      font-size: 0.9rem;
    }

    .cta {
      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
      color: var(--white);
    }

    .cta-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .cta h2 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
    }

    .cta p {
      max-width: 690px;
      color: rgba(255, 255, 255, 0.84);
    }

    .empty-state {
      display: none;
      padding: 35px;
      text-align: center;
      background: var(--white);
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--text);
    }

    .disclaimer {
      padding: 18px;
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      background: #fff8dd;
      color: #664f00;
      font-size: 0.92rem;
    }

    .footer {
      padding: 62px 0 22px;
      background: #101827;
      color: #dbe4ef;
    }

    .footer-grid {
      display: grid;
      grid-template-columns:
        1.35fr 1fr 1fr 1fr;
      gap: 30px;
    }

    .footer h3 {
      margin-bottom: 15px;
      color: var(--white);
    }

    .footer p,
    .footer a {
      color: #aeb9c8;
      font-size: 0.94rem;
    }

    .footer a:hover {
      color: var(--white);
    }

    .footer-links {
      display: grid;
      gap: 9px;
    }

    .footer-bottom {
      margin-top: 35px;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      border-top:
        1px solid rgba(255, 255, 255, 0.12);
      color: #9da9b7;
      font-size: 0.88rem;
    }

    .floating-buttons {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 900;
      display: grid;
      gap: 11px;
    }

    .float-btn {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--white);
      font-size: 1.25rem;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.2);
    }

    .whatsapp {
      background: #25d366;
    }

    .call {
      background: var(--primary);
    }

    @media (max-width: 1050px) {
      .nav-links {
        position: fixed;
        top: 78px;
        left: 0;
        right: 0;
        max-height: calc(100vh - 78px);
        overflow-y: auto;
        display: none;
        flex-direction: column;
        align-items: flex-start;
        padding: 24px 4%;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .nav-links.active {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }

      .nav-cta {
        display: none;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .type-grid,
      .category-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .filter-bar {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .college-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .steps-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .footer-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .container {
        width: min(94%, 1180px);
      }

      .section {
        padding: 60px 0;
      }

      .topbar-inner {
        justify-content: center;
        text-align: center;
      }

      .topbar-group {
        justify-content: center;
      }

      .topbar-group span:first-child {
        display: none;
      }

      .logo-copy small {
        display: none;
      }

      .hero-grid {
        min-height: auto;
        padding: 58px 0;
        gap: 30px;
      }

      .hero h1 {
        font-size: clamp(2.3rem, 12vw, 3.5rem);
      }

      .hero-actions {
        display: grid;
      }

      .hero-actions .btn {
        width: 100%;
      }

      .type-grid {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 10px;
        scroll-snap-type: x mandatory;
      }

      .type-card {
        min-width: 230px;
        scroll-snap-align: start;
      }

      .filter-bar,
      .college-grid,
      .category-grid,
      .steps-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .college-actions {
        display: grid;
      }

      .cta-box {
        align-items: flex-start;
        flex-direction: column;
      }

      .cta-box .btn {
        width: 100%;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }

    @media (max-width: 420px) {
      .logo-name {
        font-size: 1.34rem;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
      }

      .search-panel,
      .college-body {
        padding: 20px;
      }

      .college-image {
        height: 190px;
      }

      .topbar-group {
        flex-direction: column;
        gap: 1px;
        padding: 5px 0;
      }

      .floating-buttons {
        right: 12px;
        bottom: 12px;
      }

      .float-btn {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>

<body>

    <div class="container topbar-inner">

          Education • Careers • Jobs • Training

      </button>

      <ul class="nav-links" id="navLinks">
