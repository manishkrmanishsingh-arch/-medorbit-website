  <style>
    :root {
      --primary: #0756a3;
      --primary-dark: #043d77;
      --secondary: #0ea5a4;
      --accent: #ffb703;
      --success: #15803d;
      --dark: #172033;
      --text: #475569;
      --muted: #7b8796;
      --light: #f5f8fc;
      --white: #ffffff;
      --border: #dbe4ef;

      --shadow:
        0 14px 34px rgba(21, 47, 78, 0.12);

      --shadow-large:
        0 24px 60px rgba(21, 47, 78, 0.16);

      --radius: 20px;
      --radius-large: 28px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    .section {
      padding: 82px 0;
    }

    .section-white {
      background: var(--white);
    }

    .section-dark {
      background: var(--dark);
      color: var(--white);
    }

    .section-heading {
      max-width: 790px;
      margin: 0 auto 44px;
      text-align: center;
    }

    .section-heading span {
      display: inline-block;
      margin-bottom: 9px;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin-bottom: 14px;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.15;
    }

    .section-heading p {
      color: var(--text);
    }

    .section-dark .section-heading span {
      color: var(--accent);
    }

    .section-dark .section-heading p {
      color: #b8c3d1;
    }

    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-weight: 800;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
      box-shadow:
        0 10px 22px rgba(7, 86, 163, 0.24);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-light {
      background: var(--white);
      color: var(--primary);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--white);
    }

    .btn-outline {
      border-color: rgba(255, 255, 255, 0.65);
      color: var(--white);
      background: transparent;
    }

    .topbar {
      background: var(--primary-dark);
      color: var(--white);
      font-size: 0.9rem;
    }

    .topbar-inner {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );
      color: var(--white);
      font-size: 1.25rem;
      font-weight: 900;
      box-shadow:
        0 10px 22px rgba(7, 86, 163, 0.22);
    }

    .logo-copy {
      display: grid;
      line-height: 1.05;
    }

    .logo-name {
      color: var(--primary);
      font-size: 1.55rem;
      font-weight: 900;
    }

    .logo-name strong {
      color: var(--dark);
    }

    .logo-copy small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.59rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      color: var(--dark);
      font-size: 0.93rem;
      font-weight: 750;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary);
    }

    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: #eaf3fc;
      color: var(--primary);
      font-size: 1.35rem;
    }

    .announcement {
      padding: 11px 0;
      background: #fff4cc;
      color: #614c00;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary) 57%,
          var(--secondary)
        );
      color: var(--white);
    }
